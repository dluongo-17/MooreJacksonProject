name: Get Google Drive CSV

on:
  schedule:
    - cron: '0 22 * * 6'  # Every 10PM on Saturday
  workflow_dispatch:       # Also allows manual trigger from GitHub UI

jobs:
  get-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_AUTHENTICATION_CREDENTIALS }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: r-lib/actions/setup-r@v2  # Installs R

      - name: Install system libraries
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install R packages
        run: Rscript -e 'install.packages(c("googledrive"))'

      - name: Download CSV from Google Drive
        run: Rscript scripts/Get-GoogleDrive-Data.R

      - name: Commit and push CSV to repo
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add MJTrees.csv
          git diff --staged --quiet || git commit -m "Update data"
          git push
