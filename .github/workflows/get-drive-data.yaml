name: Get Google Drive CSV

on:
  schedule:
    - cron: '0 22 * * 6'  # Every 10PM on Saturday
  workflow_dispatch:

jobs:
  get-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_AUTHENTICATION_CREDENTIALS }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            googledrive

      - name: Download CSV from Google Drive
        run: Rscript scripts/Get-GoogleDrive-Data.R

      - name: Commit and push CSV to repo
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add MJTrees.csv
          git diff --staged --quiet || git commit -m "Update data"
          git push
